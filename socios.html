<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iron Gym | Gestión de Socios</title>
    <link rel="stylesheet" href="ESTILOC.css">

    <style>
        .modulo-socios {
            max-width: 1050px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .tarjeta-panel {
            background-color: var(--panel);
            border: 1px solid var(--panel-line);
            border-radius: 8px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        .encabezado-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--panel-line);
            padding-bottom: 20px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .encabezado-panel h2 {
            margin: 0;
            color: var(--yellow);
            font-size: 1.8rem;
        }

        .user-badge {
            background: #1f1f1f;
            border: 1px solid var(--panel-line);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.9rem;
            color: var(--gray);
        }

        .user-badge strong {
            color: var(--white);
        }

        .grid-kpis {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .kpi-card {
            background: #181818;
            border: 1px solid var(--panel-line);
            border-radius: 6px;
            padding: 18px;
            text-align: center;
        }

        .kpi-card .numero {
            font-size: 2.2rem;
            font-weight: 800;
            font-family: 'Arial Black', sans-serif;
            margin: 5px 0 0 0;
        }

        .kpi-card.total .numero { color: var(--white); }
        .kpi-card.vigentes .numero { color: #28a745; }
        .kpi-card.vencidos .numero { color: #dc3545; }

        .kpi-card .etiqueta {
            font-size: 0.85rem;
            color: var(--gray);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .barra-acciones {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .barra-acciones input {
            flex: 1;
            min-width: 250px;
            padding: 12px 16px;
            background: #1c1c1c;
            border: 1px solid var(--panel-line);
            color: var(--white);
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
        }

        .barra-acciones input:focus {
            border-color: var(--yellow);
        }

        .btn-accion {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .btn-primario {
            background: var(--yellow);
            color: #000;
        }

        .btn-primario:hover {
            background: #e6be00;
        }

        .btn-peligro {
            background: transparent;
            border: 1px solid var(--red);
            color: var(--red);
        }

        .btn-peligro:hover {
            background: var(--red);
            color: var(--white);
        }

        .btn-secundario {
            background: #2a2a2a;
            color: var(--white);
            border: 1px solid var(--panel-line);
        }

        .btn-secundario:hover {
            background: #333;
        }

        .contenedor-tabla {
            overflow-x: auto;
            border: 1px solid var(--panel-line);
            border-radius: 6px;
            margin-bottom: 30px;
        }

        table.tabla-socios {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
        }

        table.tabla-socios th {
            background: #1b1b1b;
            color: var(--gray);
            text-align: left;
            padding: 14px 16px;
            border-bottom: 2px solid var(--panel-line);
            text-transform: uppercase;
            font-size: 0.78rem;
            letter-spacing: 0.05em;
        }

        table.tabla-socios td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--panel-line);
        }

        .formulario-registro {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .campo-form {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .campo-form label {
            color: var(--gray);
            font-size: 0.85rem;
            font-weight: 600;
        }

        .campo-form input {
            padding: 10px 14px;
            background: #1c1c1c;
            border: 1px solid var(--panel-line);
            color: var(--white);
            border-radius: 6px;
            outline: none;
            font-size: 0.9rem;
        }

        .campo-form input:focus {
            border-color: var(--yellow);
        }

        .nav-enlace-volver {
            color: var(--gray);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }

        .nav-enlace-volver:hover {
            color: var(--yellow);
        }

        /* PANTALLA DE CARGA BAR.HTML */

        .ventana {
            width: 900px;
            height: 560px;
            background: var(--panel);
            border: 1px solid var(--panel-line);
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            margin: 40px auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
        }

        .gif-playa {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 390px;
            object-fit: cover;
            filter: grayscale(15%);
        }

        #carga::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 390px;
            background: linear-gradient(
                180deg,
                rgba(10,10,10,0.05),
                rgba(10,10,10,0.8)
            );
            pointer-events: none;
        }

        .titulo {
            position: absolute;
            top: 405px;
            left: 0;
            width: 100%;
            text-align: center;
            color: var(--yellow);
            font-family: 'Arial Black', Arial, sans-serif;
            font-size: 40px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .barra {
            position: absolute;
            top: 483px;
            left: 50%;
            transform: translateX(-50%);
            width: 431px;
            height: 45px;
            background: #262626;
            border: 1px solid #555;
            border-radius: 3px;
            overflow: hidden;
        }

        .progreso {
            width: 0%;
            height: 100%;
            background: var(--yellow);
            transition: width 0.1s linear;
        }

        .porcentaje {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 800;
            color: #0a0a0a;
        }

        @media (max-width: 920px) {
            .ventana {
                width: 95vw;
                height: 80vh;
                min-height: 400px;
            }

            .gif-playa {
                height: 55%;
            }

            #carga::after {
                height: 55%;
            }

            .titulo {
                top: 65%;
                font-size: 32px;
            }

            .barra {
                top: 82%;
                width: 90%;
                height: 45px;
            }
        }
    </style>
</head>

<body>

    <div class="grain" aria-hidden="true"></div>

    <!-- PANTALLA DE CARGA SEPARADA -->

    <div class="ventana" id="ventana">

        <div id="carga">

            <img
                class="gif-playa"
                src="fondo.png.jpeg"
                alt="Imagen del gimnasio"
            >

            <h1 class="titulo">Cargando</h1>

            <div class="barra">
                <div class="progreso" id="progreso"></div>
                <div class="porcentaje" id="porcentaje">0%</div>
            </div>

        </div>

    </div>

    <!-- PANEL DE SOCIOS -->

    <div class="modulo-socios" id="moduloSocios" style="display: none;">

        <a href="INDEC.html" class="nav-enlace-volver">
            ← Volver al sitio principal
        </a>

        <div id="panelSocios">

            <div class="tarjeta-panel">

                <div class="encabezado-panel">

                    <div style="display: flex; align-items: center; gap: 14px;">

                        <img src="Logo.png" alt="Iron Gym Logo"
                            style="width: 52px; height: 52px; border-radius: 50%; border: 2px solid var(--yellow); object-fit: cover;">

                        <div>
                            <h2>Panel de Socios</h2>

                            <div class="user-badge" data-roles="admin,recepcion">
                                Usuario: <strong id="nombreUsuario">Administrador</strong>
                                (<span id="rolUsuario">admin</span>)
                            </div>
                        </div>

                    </div>


                </div>

                <div class="grid-kpis">

                    <div class="kpi-card total">
                        <div class="etiqueta">Total de Socios</div>
                        <div class="numero" id="contadorTotal">0</div>
                    </div>

                    <div class="kpi-card vigentes">
                        <div class="etiqueta">Membresías Vigentes</div>
                        <div class="numero" id="contadorVigentes">0</div>
                    </div>

                    <div class="kpi-card vencidos">
                        <div class="etiqueta">Membresías Vencidas</div>
                        <div class="numero" id="contadorVencidos">0</div>
                    </div>

                </div>

                <div class="barra-acciones">

                    <input type="text" id="buscarSocio"
                        placeholder="🔍 Buscar socio por nombre o teléfono...">

                    <button id="btnExportar" class="btn-accion btn-secundario">
                        📋 Exportar Lista
                    </button>

                </div>

                <div class="contenedor-tabla">

                    <table class="tabla-socios">

                        <thead>
                            <tr>
                                <th>Nombre</th>
                                <th>Teléfono</th>
                                <th>Fecha Inicio</th>
                                <th>Fecha Vencimiento</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>

                        <tbody id="listaSocios">
                        </tbody>

                    </table>

                </div>

                <h3 id="tituloFormularioSocio"
                    style="color: var(--white); margin-top: 30px; margin-bottom: 10px; font-size: 1.2rem;">
                    Registrar Nuevo Socio
                </h3>

                <form id="formSocio">

                    <div class="formulario-registro">

                        <div class="campo-form">
                            <label for="nombreSocio">Nombre Completo</label>
                            <input type="text" id="nombreSocio"
    placeholder="Ej. Juan Pérez"
    pattern="[A-Za-zÁÉÍÓÚÜÑáéíóúüñ ]+"
    title="El nombre no puede llevar números"
    required>
                        </div>

                        <div class="campo-form">
                            <label for="telefonoSocio">Teléfono</label>
                            <input type="tel" id="telefonoSocio"
                                placeholder="10 dígitos" required>
                        </div>

                        <div class="campo-form">
                            <label for="fechaInicio">Fecha de Inicio</label>
                            <input type="date" id="fechaInicio" required>
                        </div>

                        <div class="campo-form">
                            <label for="fechaVencimiento">Fecha de Vencimiento</label>
                            <input type="date" id="fechaVencimiento" required>
                        </div>

                    </div>

                    <div style="margin-top: 20px; text-align: right;">

                        <button type="submit" class="btn-accion btn-primario">
                            + Registrar Socio
                        </button>

                        <button type="button" id="btnCancelarEdicion"
                            class="btn-accion btn-secundario"
                            style="display: none; margin-left: 8px;">
                            Cancelar
                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

    <!-- PANTALLA DE CARGA Y APERTURA DEL PANEL -->

    <script>
        let valor = 0;

        const progreso = document.getElementById("progreso");
        const porcentaje = document.getElementById("porcentaje");
        const ventana = document.getElementById("ventana");
        const moduloSocios = document.getElementById("moduloSocios");

        const intervalo = setInterval(() => {

            valor++;

            progreso.style.width = valor + "%";
            porcentaje.textContent = valor + "%";

            if (valor >= 100) {

                clearInterval(intervalo);

                ventana.style.display = "none";

                moduloSocios.style.display = "block";

            }

        }, 45);
    </script>

    <!-- LÓGICA DE SOCIOS -->
    <script src="socios.js"></script>

</body>
</html>
